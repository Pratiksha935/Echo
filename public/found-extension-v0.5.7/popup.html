<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="popup.css">
    <title>Found</title>
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div>
          <span class="eyebrow">FOUND · BROWSER MEMORY</span>
          <h1 id="headline">Found is live</h1>
        </div>
        <span class="statePill" id="statePill">LIVE</span>
      </header>

      <section class="workspaceCard" aria-label="Workspace connection">
        <span class="label">Workspace</span>
        <p id="account">Checking workspace connection…</p>
      </section>

      <section class="statusCard" aria-label="Current page status">
        <span class="label">Current page</span>
        <p id="status">Found checks the open page automatically. Use the on-page avatar to save URLs or review a strong match.</p>
      </section>

      <form id="capture" class="captureCard">
        <div class="captureHeader">
          <span class="label">Save this page</span>
          <small>Use anytime</small>
        </div>
        <select id="department" required aria-label="Department">
          <option value="Research">Research</option>
          <option value="Product">Product</option>
          <option value="GTM">GTM</option>
          <option value="Sales">Sales / client</option>
          <option value="Engineering">Engineering</option>
          <option value="Browser">General browser memory</option>
        </select>
        <textarea id="note" minlength="12" maxlength="1200" required placeholder="What should the team remember?"></textarea>
        <button type="submit" class="secondaryAction">Add to memory <b>↗</b></button>
      </form>

      <footer>
        <button id="connect" type="button" class="connectButton">Connect or switch workspace <b>↗</b></button>
        <small>v0.5.7 · Ambient avatar · memory capture.</small>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
